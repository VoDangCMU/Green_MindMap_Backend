name: intergration-test.yml
on:
  pull_request:
   branches: [dev]

jobs:
  intergration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies with legacy peer deps
        run: npm install --legacy-peer-deps

      - name: Source environment variables
        run: |
          if [ -f local.env ]; then
            export $(grep -v '^#' local.env | xargs)
          fi

      - name: Start dependencies services
        run: | 
              cd deploy/docker 
              docker-compose up -d 
              sleep 10

      - name: Wait for services to be ready
        run: |
          echo "Waiting for database and redis to be ready..."
          sleep 20

      - name: Build application
        run: npm run build

      - name: Start http server
        run: |
              chmod +x ./entrypoint.sh
              ./entrypoint.sh &
              sleep 15

      - name: Verify server is running
        run: |
          curl -f http://localhost:3000/check || (echo "Server failed to start" && exit 1)

      - name: Run tests
        run: npm run test

      - name: Cleanup
        if: always()
        run: |
          cd deploy/docker
          docker-compose down
